# Prod's canary conversion: mirrors deploy/overlays/dev-canary/rollout.yaml
# exactly (same container spec/probes/resources/strategy timing --
# dev's is what proved the timing live, see that file's own comment for
# why the first pause is 150s not 30s), with ENVIRONMENT: prod and
# analysis now pointed at prod's own scoped Prometheus
# (platform/rollouts/prod/analysistemplate.yaml in the platform repo,
# wired when this repo's overlay was onboarded there -- same division of
# responsibility as dev-canary's own comment describes).
#
# app.kubernetes.io/part-of hardcoded on selector/template -- kustomize's
# labels transformer doesn't drill into a Rollout CRD's selector/
# podTemplate paths (confirmed live, same note as dev-canary/dev-bluegreen's
# rollout.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: template-test-1
  labels:
    app.kubernetes.io/name: template-test-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: template-test-1
      app.kubernetes.io/part-of: local-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: template-test-1
        app.kubernetes.io/part-of: local-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: template-test-1
          image: ghcr.io/chliddle/template-test-1:placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: prod
            - name: FAULT_ERROR_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: template-test-1
            routes:
              - primary
          destinationRule:
            name: template-test-1
            canarySubsetName: canary
            stableSubsetName: stable
      analysis:
        templates:
          - templateName: template-test-1-success-rate
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      # Same timing as dev-canary, reused deliberately, not re-derived --
      # see that file's comment for the live-confirmed reasoning (the
      # first pause has to outlast the AnalysisTemplate's own worst-case
      # time-to-verdict: initialDelay 60s + interval 30s * failureLimit 2
      # = 120s minimum, or the rollout can auto-promote past a bad canary
      # before the safety net gets a chance to fire).
      steps:
        - setWeight: 20
        - pause:
            duration: 150s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
