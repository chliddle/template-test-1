apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: template-test-1

resources:
- ../../base

patches:
- path: patch-environment.yaml
  target:
    kind: Deployment
    name: template-test-1

# Placeholder tag -- overwritten by .github/workflows/release.yml with the
# new semver tag (v1.4.2-style) whenever semantic-release cuts a version.
# That tag always points at the exact digest already validated in
# deploy/overlays/dev (never rebuilds) -- pinning by tag here instead of
# the raw digest is purely for readability (kubectl/Argo CD show
# "v1.4.2", not a 71-char sha256 string); see release.yml's own comment
# for the mutable-tag-vs-immutable-digest trade-off this accepts.
images:
- name: ghcr.io/chliddle/template-test-1
  newName: ghcr.io/chliddle/template-test-1
  newTag: 1.3.1
