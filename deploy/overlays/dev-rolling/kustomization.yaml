# Milestone 6 (platform repo): the control group in the three-way
# deployment-strategy comparison sandbox -- a plain apps/v1 Deployment,
# today's exact pre-Milestone-6 behavior (RollingUpdate, no analysis, no
# manual gate), kept unchanged on purpose so it's a real baseline to
# compare dev-bluegreen/dev-canary against. Same base+patch shape as
# prod's own overlay (unaffected by this milestone).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: template-test-1-rolling

resources:
- ../../base

patches:
- path: patch-environment.yaml
  target:
    kind: Deployment
    name: template-test-1

# Placeholder digest -- CI overwrites this with the real one via
# `kustomize edit set image` after building and pushing to GHCR.
images:
- digest: sha256:e6132e1a43943eedef2d6c81cbf70f3272bbbfacf31e278b52f770f9dafc3c6a
  name: ghcr.io/chliddle/template-test-1
  newName: ghcr.io/chliddle/template-test-1
