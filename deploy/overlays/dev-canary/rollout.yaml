# Native Istio traffic routing (VirtualService+DestinationRule subsets --
# confirmed via Argo Rollouts' own docs to be built into the controller,
# no plugin needed) tied to automated Prometheus analysis with automatic
# abort/rollback. The VirtualService/DestinationRule/AnalysisTemplate
# themselves live in the platform repo, not here -- same division of
# responsibility as HTTPRoutes: this repo owns the workload, the platform
# repo wires per-app routing/analysis when onboarding (see
# platform/rollouts/template-test-1-canary/ in the platform repo).
#
# app.kubernetes.io/part-of hardcoded on selector/template -- kustomize's
# labels transformer doesn't drill into a Rollout CRD's selector/
# podTemplate paths (confirmed live, same note as dev-bluegreen's
# rollout.yaml and the app-template repo's own base rollout.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: template-test-1
  labels:
    app.kubernetes.io/name: template-test-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: template-test-1
      app.kubernetes.io/part-of: local-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: template-test-1
        app.kubernetes.io/part-of: local-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: template-test-1
          image: ghcr.io/chliddle/template-test-1:placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: dev-canary
            - name: FAULT_ERROR_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: template-test-1
            routes:
              - primary
          destinationRule:
            name: template-test-1
            canarySubsetName: canary
            stableSubsetName: stable
      analysis:
        templates:
          - templateName: template-test-1-success-rate
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      # Time-based pauses (not indefinite `pause: {}`), deliberately: the
      # point of the canary path is fully automated progression as long as
      # analysis keeps passing, aborting only if it fails -- an indefinite
      # pause would need a manual `promote` even on a healthy rollout,
      # which is what dev-bluegreen's manual gate is already for.
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
